[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "gitpython>=3.1.43",
    "neo4j>=5.22.0",
    "openai>=1.35.0",
    "qdrant-client>=1.10.0",
    "asyncpg>=0.29.0",
    "tree-sitter>=0.23.0,<0.25",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
