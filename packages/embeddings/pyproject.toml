[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embeddings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.35.0",
    "qdrant-client>=1.10.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embeddings"]
