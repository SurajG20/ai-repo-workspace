[project]
name = "retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.10.0",
    "neo4j>=5.22.0",
    "openai>=1.30.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "embeddings>=0.1.0",
    "graph-engine>=0.1.0",
    "prompts>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
