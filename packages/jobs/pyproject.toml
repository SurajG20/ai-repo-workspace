[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobs"
version = "0.1.0"
description = "Indexing Pipeline: owns the job DAG, status transitions, claiming, retries, and artifacts."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]
