services:
  backend:
    environment:
      - API_DEBUG=true
    command: ["sh", "/app/api-entrypoint.sh", "--reload", "--log-level", "debug"]

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    command: ["npm", "run", "dev"]

  worker:
    command: ["celery", "-A", "app.main", "worker", "--loglevel=debug", "--concurrency=2"]

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"

  qdrant:
    ports:
      - "6333:6333"
