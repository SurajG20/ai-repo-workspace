services:
  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.nginx
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256M
    cpus: "0.5"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      target: development
    ports:
      - "3001:3000"
    volumes:
      - ./apps/frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1G
    cpus: "1.0"
    stop_grace_period: 10s

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: development
    command: ["sh", "/app/api-entrypoint.sh", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512M
    cpus: "1.0"
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
      target: development
    volumes:
      - ./apps/workers:/app/apps/workers
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./:/app/workspace:z
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.main inspect ping 2>/dev/null | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 512M
    cpus: "1.0"
    stop_grace_period: 30s

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
      target: development
    command: ["celery", "-A", "app.main", "beat", "--loglevel=info"]
    volumes:
      - ./apps/workers:/app/apps/workers
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aiworkspace
    restart: unless-stopped
    mem_limit: 256M
    cpus: "0.5"
    stop_grace_period: 30s

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiworkspace}
      POSTGRES_DB: ${POSTGRES_DB:-aiworkspace}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiworkspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512M
    cpus: "1.0"

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 256M
    cpus: "0.5"

  neo4j:
    image: docker.io/library/neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiworkspace}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1G
    cpus: "1.0"

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - aiworkspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; echo -e \"GET /healthz HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3; grep -q \"healthz check passed\" <&3 || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512M
    cpus: "1.0"

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - aiworkspace
    restart: unless-stopped
    profiles:
      - ai
      - full

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  neo4jlogs:
  qdrantdata:
  ollamadata:

networks:
  aiworkspace:
    driver: bridge
